  release:
    name: Release
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/healpix-geo
    permissions:
      id-token: write # upload the release artifacts and request sigstore signing certificate
      attestations: write # generate the artifact attestation
      artifact-metadata: write # create the artifact storage record
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [linux, musllinux, windows, macos]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "wheels-*"
          path: dist
          merge-multiple: true
      - name: Show downloaded files
        shell: bash
        run: ls -lR
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
