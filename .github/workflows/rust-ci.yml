name: Rust CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/rust-ci.yml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/rust-ci.yml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cache-pixi-lock:
    name: cache pixi.lock
    if: github.repository == 'GRID4EARTH/healpix-geo'
    runs-on: ubuntu-slim
    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/create-and-cache@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        id: pixi-lock
        with:
          hash-files: |
            pixi.toml
            Cargo.toml
            healpix-geo-python/pyproject.toml
            healpix-geo-python/pixi.toml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: cache-pixi-lock

    strategy:
      matrix:
        env: ["ci-py313"]

    defaults:
      run:
        shell: bash -l {0}

    env:
      FORCE_COLOR: 3
      ENV: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # - name: Install Rust
      #   run: |
      #     rustup update stable
      #     rustup default stable
      #     rustup component add clippy

      - uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

      - name: setup environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: "${{ matrix.env }}"

      - name: Create rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Help finding installed libraries
        run: |
          export CONDA_PREFIX=$(pixi run -e $ENV --frozen 'echo $CONDA_PREFIX')
          if [[ -z "$CONDA_PREFIX" ]]; then
            echo "CONDA_PREFIX is unset!"
            exit 1
          fi

          pushd $CONDA_PREFIX
          echo "PKG_CONFIG_PATH=$(readlink -f lib/pkgconfig)" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(readlink -f lib)" >> $GITHUB_ENV
          popd

      - name: Help the linker on macos
        if: runner.os == 'MacOS'
        run: |
          export CONDA_PREFIX=$(pixi run -e $ENV --frozen 'echo $CONDA_PREFIX')

          if [ ! -d target/debug/deps ]; then
              mkdir -p target/debug/deps
              ln -s $CONDA_PREFIX/lib/*.dylib target/debug/deps/
          fi

      - name: Cargo clippy
        run: |
          pixi run -e $ENV lint-rust

  tests:
    name: Rust tests
    needs: cache-pixi-lock
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        env: ["rust"]
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]

    defaults:
      run:
        shell: bash -l {0}

    env:
      FORCE_COLOR: 3
      ENV: ${{ matrix.env }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

      - name: setup environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: "${{ matrix.env }}"

      - name: Create rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Help finding installed libraries
        run: |
          export CONDA_PREFIX=$(pixi run -e $ENV --frozen 'echo $CONDA_PREFIX')
          if [[ -z "$CONDA_PREFIX" ]]; then
            echo "CONDA_PREFIX is unset!"
            exit 1
          fi

          pushd $CONDA_PREFIX
          echo "PKG_CONFIG_PATH=$(readlink -f lib/pkgconfig)" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$(readlink -f lib)" >> $GITHUB_ENV
          popd

      - name: Help the linker on macos
        if: runner.os == 'MacOS'
        run: |
          export CONDA_PREFIX=$(pixi run -e $ENV --frozen 'echo $CONDA_PREFIX')

          if [ ! -d target/debug/deps ]; then
              mkdir -p target/debug/deps
              ln -s $CONDA_PREFIX/lib/*.dylib target/debug/deps/
          fi

      - name: Cargo clippy
        run: |
          pixi run -e $ENV rust-tests
