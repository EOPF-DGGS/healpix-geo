name: python CI
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/python-ci.yml"
      - "pixi.toml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"
      - "healpix-geo-python/**"
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/python-ci.yml"
      - "pixi.toml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"
      - "healpix-geo-python/**"
  workflow_dispatch: # allows triggering manually

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-ci-trigger:
    name: detect ci trigger
    runs-on: ubuntu-slim
    if: |
      github.repository == 'GRID4EARTH/healpix-geo'
      && (github.event_name == 'push' || github.event_name == 'pull_request')
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[skip-ci]"

  cache-pixi-lock:
    name: cache pixi.lock
    runs-on: ubuntu-slim
    needs: detect-ci-trigger
    if: |
      needs.detect-ci-trigger.outputs.triggered == 'false'
      && !contains(github.event.pull_request.labels.*.name, 'skip-ci')
    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}

    env:
      BUILD_EDITABLE_PYTHON: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/create-and-cache@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        id: pixi-lock
        with:
          hash-files: |
            pixi.toml
            Cargo.toml
            python/healpix-geo/pyproject.toml
            python/healpix-geo/pixi.toml

  test:
    name: ${{ matrix.os }} | ${{ matrix.env }}
    needs: cache-pixi-lock
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "macos-latest"
          - "windows-latest"
        env: ["ci-py311", "ci-py313", "ci-py314"]

    env:
      FORCE_COLOR: 3
      ENV: ${{ matrix.env }}
      RUNNER_OS: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

      - name: Create rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "py"

      - name: setup environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: "${{ matrix.env }}"
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          cache: true
          frozen: true

      - name: editable install
        run: |
          pixi clean --build
          pixi install --frozen -e "$ENV"

      - name: Check imports
        run: |
          pixi run \
              -e $ENV \
              --frozen \
              python -c 'import healpix_geo'

      - name: Run tests
        run: |
          pixi run -e $ENV --frozen tests

  doctests:
    name: doctests | ubuntu-latest | ${{ matrix.env }}
    needs: cache-pixi-lock
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        env: ["ci-py313"]

    env:
      FORCE_COLOR: 3
      ENV: ${{ matrix.env }}
      RUNNER_OS: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: Parcels-code/pixi-lock/restore@1fab4c17af8243f6ca1321bc941cf2325f46c05d # v0.1.1
        with:
          cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}

      - name: Create rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: "py${{ matrix.python-version }}"

      - name: setup environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          environments: "${{ matrix.env }}"
          pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
          cache-key: "pixi-doctests-"
          cache: true
          frozen: true

      - name: editable install
        run: |
          pixi clean --build
          pixi install --frozen -e "$ENV"

      - name: Check imports
        run: |
          pixi run \
              -e $ENV \
              --frozen \
              python -c 'import healpix_geo'

      - name: Run tests
        run: |
          pixi run -e $ENV --frozen doctests
