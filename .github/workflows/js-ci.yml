name: Javascript CI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/js-ci.yml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"
      - "healpix-geo-js/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/js-ci.yml"
      - "Cargo.*"
      - "healpix-geo/Cargo.toml"
      - "healpix-geo/src/**"
      - "healpix-geo-js/**"

concurrency:
  group: ${{ github.workflow }}.${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: wasm ci
    if: github.repository == 'GRID4EARTH/healpix-geo'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: healpix-geo-js

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Create rust cache
        if: github.event_name != 'release'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: wasm32

      - name: setup
        run: |
          cargo install wasm-pack@0.15.0
          npm install

      - name: run tests
        run: |
          npm run build:node
          npm run test:js
          npm run test:wasm-firefox
          npm run test:wasm-chrome
