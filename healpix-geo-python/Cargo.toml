[package]
name = "healpix-geo-python"
version = "0.4.1"
edition = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "_healpix_geo_python"
crate-type = ["cdylib"]

[dependencies]
healpix-geo = { workspace = true }
moc = { workspace = true }
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
rayon = { workspace = true }
geodesy = { workspace = true }
cdshealpix = { workspace = true }
